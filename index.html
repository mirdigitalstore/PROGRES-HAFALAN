<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>As-Sa'adah | Progress Hafalan TKQ/TPQ</title>
    
    <!-- Google Fonts: Poppins & Amiri for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- QR Code Generator & JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Poppins', 'sans-serif'],
                        arabic: ['Amiri', 'serif']
                    },
                    colors: {
                        primary: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 7s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .loader { border-top-color: #16a34a; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        html { scroll-behavior: smooth; }
        
        .progress-stripe {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.2) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.2) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem; animation: moveStripe 1s linear infinite;
        }
        @keyframes moveStripe { from { background-position: 1rem 0; } to { background-position: 0 0; } }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .accordion-content { transition: max-height 0.3s ease-out, opacity 0.3s ease-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 2000px; opacity: 1; }

        @media print {
            body.is-printing-single * { visibility: hidden !important; }
            body.is-printing-single #modal-container { background: white !important; align-items: start !important; justify-content: start !important; padding: 0 !important; visibility: visible !important; }
            body.is-printing-single #print-area, body.is-printing-single #print-area * { visibility: visible !important; }
            body.is-printing-single #print-area { position: absolute; left: 0; top: 0; border: 1px solid #e2e8f0; border-radius: 16px; width: 6.5cm; padding: 20px; margin: 0; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col relative selection:bg-emerald-200 selection:text-emerald-900">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1]">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-teal-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-green-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Container Utama -->
    <div id="app" class="flex-grow flex flex-col w-full h-full relative z-10"></div>
    
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-full max-w-xs md:max-w-sm pointer-events-none px-4 md:px-0"></div>
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-200 overflow-y-auto"></div>
    
    <div id="global-loader" class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-white/80 backdrop-blur-md">
        <div class="relative">
            <div class="w-16 h-16 border-4 border-emerald-100 border-t-emerald-600 rounded-full loader"></div>
            <i data-lucide="book-open" class="w-6 h-6 text-emerald-600 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 animate-pulse-slow"></i>
        </div>
        <p class="text-emerald-700 font-bold mt-4 tracking-wider text-sm animate-pulse-slow">Memuat Sistem...</p>
    </div>

    <script>
        /* STREAMING_CHUNK: Configuration */
        const API_URL = "https://script.google.com/macros/s/AKfycbxMDCrSrdk5Bf4p1pDvoduCvTMZNNZxJU83XTFNHGdI_3ejPp7p14duqHT_-DMdR2A9/exec"; 
        
        const TPQ_LOGO = "https://cdn.phototourl.com/member/2026-09-08-92a66d20-b9c8-48ce-a051-79bf5c379dc3.png";
        const AVATAR_L = "https://cdn.phototourl.com/free/2026-09-10-3b329aa0-bcd0-4e7c-b2fb-436446f1df2f.png";
        const AVATAR_P = "https://cdn.phototourl.com/free/2026-09-10-83a53473-e09c-413e-a624-98ed3b0a0be2.png";

        const state = {
            currentUser: null, 
            globalPdfUrl: "",
            students: [],
            materials: [],
            classes: [],
            teachers: []
        };

        const appDiv = document.getElementById('app');

        /* STREAMING_CHUNK: API Helpers */
        async function fetchApi(action, params = {}, method = 'GET', body = null) {
            if (!API_URL || API_URL === "TEMPEL_URL_WEB_APP_GOOGLE_APPS_SCRIPT_DI_SINI") {
                showToast("URL API Belum Dikonfigurasi!", "error");
                return { success: false, message: "URL API Belum Dikonfigurasi!" };
            }

            let url = `${API_URL}?action=${action}`;
            if (method === 'GET' && Object.keys(params).length > 0) {
                url += '&' + new URLSearchParams(params).toString();
            }

            try {
                const options = { method };
                if (method === 'POST') {
                    options.body = JSON.stringify(body);
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                }
                const res = await fetch(url, options);
                if (!res.ok) throw new Error('Koneksi Gagal');
                return await res.json();
            } catch (e) {
                console.error("API Error:", e);
                return { success: false, message: "Koneksi ke server bermasalah." };
            }
        }
        
        const apiGet = (action, params) => fetchApi(action, params, 'GET');
        const apiPost = (action, body) => fetchApi(action, {}, 'POST', body);

        /* STREAMING_CHUNK: UI Utilities */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600/95' : (type === 'error' ? 'bg-rose-600/95' : 'bg-slate-800/95');
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'x-circle' : 'info');
            toast.className = `${bgColor} backdrop-blur-md text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transform transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto mt-2 border border-white/10 z-[100]`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i><p class="text-sm font-medium tracking-wide leading-tight">${message}</p>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showLoading(show = true) {
            const loader = document.getElementById('global-loader');
            if (show) loader.classList.replace('hidden', 'flex');
            else {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.replace('flex', 'hidden'); loader.classList.remove('opacity-0'); }, 200);
            }
        }

        function openModal(htmlContent) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = htmlContent;
            modal.classList.replace('hidden', 'flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.replace('flex', 'hidden');
                modal.innerHTML = '';
            }, 200);
        }

        /* STREAMING_CHUNK: Public Student Progress View */
        async function renderStudentProgress(token) {
            showLoading(true);
            const response = await apiGet('getStudentProgress', { token });
            showLoading(false);

            if (!response.success) {
                appDiv.innerHTML = `
                    <div class="flex-grow flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                        <div class="w-24 h-24 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-6 shadow-lg">
                            <i data-lucide="shield-alert" class="w-12 h-12"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Data Tidak Ditemukan</h2>
                        <button onclick="goToHome()" class="mt-8 px-6 py-2 bg-emerald-600 text-white rounded-full text-sm font-semibold hover:bg-emerald-700 transition-colors">Kembali ke Beranda</button>
                    </div>`;
                lucide.createIcons();
                return;
            }

            const data = response.data;
            state.globalPdfUrl = data.globalPdfUrl || "";
            state.materials = data.materials; 

            const grouped = data.materials.reduce((acc, curr) => {
                if(!acc[curr.category]) acc[curr.category] = [];
                acc[curr.category].push(curr);
                return acc;
            }, {});

            let matHTML = '';
            let index = 0;
            for (const [category, items] of Object.entries(grouped)) {
                const catId = `cat-${index}`;
                const hafalCount = items.filter(i => i.status === 'HAFAL').length;
                const totalCount = items.length;
                const isAllHafal = hafalCount === totalCount && totalCount > 0;
                
                matHTML += `
                <div class="mb-3 animate-slide-up category-group" style="animation-delay: ${index * 50}ms; opacity: 0; animation-fill-mode: forwards;">
                    <div class="bg-white rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.02)] border ${isAllHafal ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-100'} overflow-hidden">
                        
                        <button onclick="toggleAccordion('${catId}')" class="w-full flex items-center justify-between p-4 focus:outline-none hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${isAllHafal ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'} flex items-center justify-center">
                                    <i data-lucide="${isAllHafal ? 'check-circle' : 'book-open'}" class="w-4 h-4"></i>
                                </div>
                                <div class="text-left">
                                    <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider leading-none">${category}</h3>
                                    <p class="text-[10px] font-bold mt-1 ${isAllHafal ? 'text-emerald-600' : 'text-slate-400'}">${hafalCount} dari ${totalCount} Selesai</p>
                                </div>
                            </div>
                            <i data-lucide="chevron-down" id="icon-${catId}" class="w-5 h-5 text-slate-400 transform transition-transform duration-200"></i>
                        </button>
                        
                        <div id="${catId}" class="accordion-content border-t border-slate-50 divide-y divide-slate-50">
                `;
                
                items.forEach(m => {
                    let badgeClass = m.status === 'HAFAL' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 
                                     m.status === 'PROSES' ? 'bg-amber-50 text-amber-600 border-amber-100' : 
                                     'bg-slate-50 text-slate-400 border-slate-100';
                    let dotColor = m.status === 'HAFAL' ? 'bg-emerald-500' : m.status === 'PROSES' ? 'bg-amber-500' : 'bg-slate-300';
                    
                    matHTML += `
                        <div class="material-item public-material-item flex justify-between items-center p-3 pl-5 hover:bg-slate-50/50 transition-colors cursor-pointer" onclick="openLearningModal('${m.id}')" data-status="${m.status}">
                            <div class="flex items-center gap-3 flex-grow pr-3">
                                <div class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0 shadow-sm"></div>
                                <div>
                                    <p class="text-sm font-semibold text-slate-700 leading-tight">${m.name}</p>
                                    <p class="text-[9px] text-slate-400 mt-0.5">Ketuk untuk detail</p>
                                </div>
                            </div>
                            <span class="shrink-0 px-2.5 py-1 text-[9px] font-bold rounded-lg border ${badgeClass}">${m.status}</span>
                        </div>
                    `;
                });
                matHTML += `</div></div></div>`;
                index++;
            }

            let avatarSrc = data.student.gender === 'P' ? AVATAR_P : AVATAR_L;
            if(data.student.photo && data.student.photo.trim() !== '') avatarSrc = data.student.photo;

            appDiv.innerHTML = `
                <div class="bg-gradient-to-br from-emerald-600 via-emerald-500 to-teal-700 text-white pt-6 pb-32 px-6 relative overflow-hidden shrink-0 shadow-xl">
                    <div class="absolute top-0 right-0 p-4 opacity-10 transform translate-x-4 -translate-y-4">
                        <i data-lucide="award" class="w-48 h-48"></i>
                    </div>
                    
                    <div class="absolute top-5 right-5 flex gap-2 z-20">
                        <button onclick="openPdf()" class="p-2 bg-white/20 hover:bg-white/30 rounded-full backdrop-blur-md transition-colors text-white border border-white/30 shadow-sm" title="Baca Materi Lengkap (PDF)">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                        </button>
                        <button onclick="goToHome()" class="p-2 bg-white/20 hover:bg-white/30 rounded-full backdrop-blur-md transition-colors text-white border border-white/30 shadow-sm" title="Beranda">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <div class="relative z-10 text-center animate-slide-down flex flex-col items-center">
                        <img src="${TPQ_LOGO}" alt="Logo TPQ" class="w-14 h-14 object-contain mb-2 drop-shadow-md">
                        <h1 class="text-xl font-bold tracking-wider mb-1 drop-shadow-sm">AS-SA'ADAH</h1>
                        <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-widest drop-shadow-sm">Buku Prestasi Digital</p>
                    </div>
                </div>

                <div class="px-4 -mt-20 relative z-20 pb-12 max-w-md mx-auto w-full">
                    <div class="glass rounded-[2rem] p-6 shadow-2xl shadow-emerald-900/10 mb-6 text-center relative animate-slide-up" style="animation-delay: 100ms; opacity: 0; animation-fill-mode: forwards;">
                        <img src="${avatarSrc}" alt="Avatar Siswa" class="w-20 h-20 mx-auto object-cover rounded-full -mt-14 mb-3 border-4 border-white shadow-lg bg-white">
                        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight leading-none">${data.student.name}</h2>
                        <div class="inline-block mt-2 px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-semibold border border-emerald-100">
                            ${data.student.class}
                        </div>
                        
                        <div class="mt-6">
                            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                <span>Total Pencapaian</span>
                                <span class="text-emerald-600 text-sm">${data.stats.percentage}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-3 mb-4 overflow-hidden shadow-inner p-0.5">
                                <div class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full progress-stripe transition-all duration-1000 ease-out" style="width: ${data.stats.percentage}%" id="pb-bar"></div>
                            </div>
                            
                            <!-- Filter Tabs -->
                            <div class="flex gap-2 overflow-x-auto hide-scroll justify-center pb-1 mt-4">
                                <button onclick="filterPublicProgress('SEMUA')" class="pub-filter-btn active bg-slate-800 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all shadow-sm" data-status="SEMUA">Semua</button>
                                <button onclick="filterPublicProgress('HAFAL')" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all" data-status="HAFAL">Hafal (${data.stats.hafal})</button>
                                <button onclick="filterPublicProgress('PROSES')" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all" data-status="PROSES">Proses (${data.stats.proses})</button>
                                <button onclick="filterPublicProgress('BELUM')" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all" data-status="BELUM">Belum (${data.stats.belum})</button>
                            </div>
                        </div>
                    </div>

                    <div id="materials-container">${matHTML}</div>
                </div>
            `;
            lucide.createIcons();

            window.filterPublicProgress = function(status) {
                const items = document.querySelectorAll('.public-material-item');
                const buttons = document.querySelectorAll('.pub-filter-btn');
                
                buttons.forEach(btn => {
                    if(btn.dataset.status === status) btn.className = `pub-filter-btn active bg-slate-800 text-white shadow-sm px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all`;
                    else btn.className = `pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 hover:bg-slate-100 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all`;
                });

                items.forEach(item => {
                    item.style.display = (status === 'SEMUA' || item.dataset.status === status) ? 'flex' : 'none';
                });

                document.querySelectorAll('.category-group').forEach(group => {
                    const visibleItems = Array.from(group.querySelectorAll('.public-material-item')).filter(i => i.style.display !== 'none');
                    group.style.display = visibleItems.length === 0 ? 'none' : 'block';
                    const content = group.querySelector('.accordion-content');
                    const icon = group.querySelector('i[data-lucide="chevron-down"]');
                    if (status !== 'SEMUA' && visibleItems.length > 0) {
                        content.classList.add('open');
                        if(icon) icon.style.transform = 'rotate(180deg)';
                    }
                });
            }
        }

        window.openPdf = function() {
            if (!state.globalPdfUrl || state.globalPdfUrl.trim() === '') {
                showToast('Materi PDF belum tersedia.', 'error');
                return;
            }
            window.open(state.globalPdfUrl, '_blank');
        }

        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if(!content) return;
            if(content.classList.contains('open')) {
                content.classList.remove('open');
                if(icon) icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                if(icon) icon.style.transform = 'rotate(180deg)';
            }
        }

        window.openLearningModal = function(materialId) {
            const material = state.materials.find(m => m.id === materialId);
            if(!material) return;

            let formattedArabic = '';
            if (material.arabic) {
                const verses = material.arabic.split('-').map(v => v.trim()).filter(v => v.length > 0);
                if (verses.length > 1) {
                    const arabicNumbers = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
                    formattedArabic = verses.map((verse, index) => {
                        const numStr = (index + 1).toString();
                        const mappedNum = numStr.split('').map(d => arabicNumbers[parseInt(d)]).join('');
                        const verseCircle = `<span class="inline-flex items-center justify-center min-w-[30px] h-[30px] rounded-full border-2 border-emerald-400 text-emerald-600 text-[14px] font-bold mx-1.5 bg-emerald-50 shadow-sm leading-none select-none relative top-1 font-sans" dir="ltr">${mappedNum}</span>`;
                        return `${verse} ${verseCircle}`;
                    }).join(' ');
                } else {
                    formattedArabic = material.arabic;
                }
            }

            const modalHtml = `
                <div class="bg-white rounded-t-[2.5rem] md:rounded-[2.5rem] w-full max-w-md mt-auto md:mt-0 p-6 shadow-2xl relative animate-slide-up flex flex-col max-h-[85vh]">
                    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-200 rounded-full md:hidden"></div>
                    
                    <div class="flex justify-between items-start mt-4 md:mt-0 mb-6 shrink-0">
                        <div>
                            <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-wider">${material.category}</span>
                            <h3 class="text-xl font-extrabold text-slate-800 leading-tight mt-1">${material.name}</h3>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <div class="overflow-y-auto hide-scroll pb-6 space-y-6">
                        ${material.image ? `<img src="${material.image}" alt="Ilustrasi" class="w-full rounded-2xl shadow-sm border border-slate-100 object-cover">` : ''}

                        ${material.desc ? `
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <p class="text-xs text-slate-600 leading-relaxed font-medium"><i data-lucide="lightbulb" class="w-4 h-4 inline-block text-amber-500 mr-1 mb-1"></i> ${material.desc}</p>
                            </div>
                        ` : ''}

                        ${material.arabic ? `
                            <div class="text-right bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100/50">

        window.toggleSelectAllQR = function(source) {
            const checkboxes = document.querySelectorAll('.student-qr-cb');
            checkboxes.forEach(cb => cb.checked = source.checked);
            updateBulkQRButton();
        }

        window.updateBulkQRButton = function() {
            const anyChecked = document.querySelectorAll('.student-qr-cb:checked').length > 0;
            const btn = document.getElementById('btnBulkQR');
            if(anyChecked) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            } else {
                btn.classList.add('hidden');
                btn.classList.remove('flex');
            }
        }

            if(state.classes.length === 0) {
                const res = await apiGet('getClasses');
                state.classes = res.success ? res.data : [];

            let student = { name: '', class: '', gender: 'L', photo: '' };
            let title = "Tambah Siswa Baru";
            if(id) {
                student = state.students.find(s => s.id === id) || student;
                title = "Edit Data Siswa";
            }

            const classOptions = state.classes.map(c => `<option value="${c.name}" ${student.class === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

            const modalHtml = `

        window.saveStudent = async function(id) {
            const name = document.getElementById('form-student-name').value.trim();
            const cls = document.getElementById('form-student-class').value;
            const gender = document.getElementById('form-student-gender').value;
            const photo = document.getElementById('form-student-photo').value.trim();

            if(!name || !cls) return showToast('Nama dan Kelas wajib diisi', 'error');

            showLoading(true);
            const endpoint = id ? 'updateStudent' : 'addStudent';
            const payload = { id, name, class: cls, gender, photo, adminName: state.currentUser.name };
            
            const res = await apiPost(endpoint, payload);
            showLoading(false);

            if(res.success) {
                showToast(id ? 'Data siswa diperbarui!' : 'Siswa berhasil ditambahkan!', 'success');
                closeModal();
                loadStudentsAdmin();
            } else {
                showToast(res.message, 'error');
            }

        let pendingImportData = [];
        window.previewImport = function() {
            const category = document.getElementById('import-category').value;
            const csvText = document.getElementById('import-csv-data').value.trim();
            if(!csvText) return showToast('Data CSV masih kosong!', 'error');

            const lines = csvText.split('\n');
            pendingImportData = [];

            lines.forEach((line) => {
                if(!line.trim()) return;
                const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if(matches && matches.length > 0) {
                    const parsed = matches.map(m => m.replace(/^"|"$/g, '').trim());
                    pendingImportData.push({
                        category: category,
                        name: parsed[0] || 'Tanpa Nama',
                        arabic: parsed[1] || '',
                        latin: parsed[2] || '',
                        arti: parsed[3] || '',
                        image: parsed[4] || ''
                    });
                }
            });

            if(pendingImportData.length === 0) return showToast('Format tidak sesuai', 'error');

            const modalHtml = `
                <div class="bg-white rounded-[2rem] w-full max-w-2xl p-6 shadow-2xl relative animate-slide-up flex flex-col mx-auto my-auto max-h-[90vh]">

                        </div>

                            </thead>
                            <tbody class="divide-y divide-slate-50 text-slate-700">
                                ${pendingImportData.map(d => `<tr><td class="p-3 font-semibold">${d.name}</td><td class="p-3 text-right font-arabic text-sm" dir="rtl">${d.arabic ? '✓ Ada' : '-'}</td><td class="p-3 truncate max-w-[100px]">${d.latin}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                    <button onclick="processImport()" class="w-full bg-emerald-600 text-white px-6 py-3.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 shadow-md">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Simpan ke Database
                    </button>
                </div>
            `;
            openModal(modalHtml);
        }
        window.processImport = async function() {
            showLoading(true);

                closeModal();
                loadMasterData('materi'); 
            }
        }

        window.saveTeacher = async function(id) {

            const plainName = document.getElementById('form-teacher-name').value.trim();
            const username = document.getElementById('form-teacher-user').value.trim().toLowerCase();

            const checkboxes = document.querySelectorAll('input[name="teacher_classes"]:checked');
            const classesArray = Array.from(checkboxes).map(cb => cb.value);

            if(!plainName || !username || !password) return showToast('Harap lengkapi semua form input.', 'error');
            if(classesArray.length === 0) return showToast('Pilih minimal 1 kelas akses', 'error');

            const fullName = title + plainName;
            const classesStr = classesArray.join(',');

            showLoading(true);
            const endpoint = id ? 'updateTeacher' : 'addTeacher';
            const res = await apiPost(endpoint, { id, name: fullName, username, password, classes: classesStr });
            showLoading(false);

            if(res.success) {

                closeModal();
                loadMasterData('akun');
            } else {
                showToast(res.message, 'error');

        }

            if(newStatus === 'PROSES') btnElement.className = "px-2 py-1 text-[9px] font-bold rounded-md transition-all duration-300 bg-white text-amber-600 shadow-sm";
            if(newStatus === 'HAFAL') btnElement.className = "px-2 py-1 text-[9px] font-bold rounded-md transition-all duration-300 bg-white text-emerald-600 shadow-sm";

            const card = container.closest('.modal-material-item');
            card.dataset.status = newStatus; 

            updateModalCountsDynamically();

            apiPost('updateProgress', { studentId, materialId, status: newStatus, teacher: state.currentUser.name });

                if(item.dataset.status === 'BELUM') belum++;
            });
            
            const spanProses = document.getElementById('count-prs');
            const spanBelum = document.getElementById('count-blm');
            const spanHafal = document.getElementById('count-hfl');
            
            if(spanProses) spanProses.innerText = proses;
            if(spanBelum) spanBelum.innerText = belum;
            if(spanHafal) spanHafal.innerText = hafal;
        }

        /* STREAMING_CHUNK: Bulk QR Print and Render */
        window.downloadBulkQR = async function() {
            const checkboxes = document.querySelectorAll('.student-qr-cb:checked');
            const selectedTokens = Array.from(checkboxes).map(cb => cb.value);
            if(selectedTokens.length === 0) return;

            const studentsToDownload = state.students.filter(s => selectedTokens.includes(s.token));
            
            showLoading(true);
            
            try {
                const zip = new JSZip();
                const baseUrl = window.location.origin + window.location.pathname;
                
                if (document.fonts) {
                    await document.fonts.ready;
                }

                const logoImg = await new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; 
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null); 
                    img.src = TPQ_LOGO;
                });

                // Render off-screen
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed';
                tempDiv.style.left = '-9999px';
                document.body.appendChild(tempDiv);

                for (let i = 0; i < studentsToDownload.length; i++) {
                    const s = studentsToDownload[i];
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 1050;
                    canvas.height = 1485;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.setLineDash([20, 15]);
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height - 4);
                    ctx.lineTo(canvas.width, canvas.height - 4);
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = '#6ee7b7'; 
                    ctx.stroke();
                    ctx.setLineDash([]); 

                    if (logoImg) {
                        const logoSize = 130;
                        ctx.drawImage(logoImg, (canvas.width - logoSize) / 2, 140, logoSize, logoSize);
                    }

                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#064e3b'; 
                    ctx.font = '900 48px Poppins, sans-serif';
                    ctx.fillText("AS-SA'ADAH", canvas.width / 2, 350);

                    ctx.fillStyle = '#059669'; 
                    ctx.font = 'bold 24px Poppins, sans-serif';
                    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '5px'; 
                    ctx.fillText("KARTU HAFALAN DIGITAL", canvas.width / 2, 410);
                    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';

                    const boxSize = 680;
                    const boxX = (canvas.width - boxSize) / 2;
                    const boxY = 480;

                    ctx.shadowColor = 'rgba(0, 0, 0, 0.06)';
                    ctx.shadowBlur = 40;
                    ctx.shadowOffsetY = 15;
                    ctx.fillStyle = '#ffffff';
                    
                    const radius = 50;
                    ctx.beginPath();
                    ctx.moveTo(boxX + radius, boxY);
                    ctx.lineTo(boxX + boxSize - radius, boxY);
                    ctx.quadraticCurveTo(boxX + boxSize, boxY, boxX + boxSize, boxY + radius);
                    ctx.lineTo(boxX + boxSize, boxY + boxSize - radius);
                    ctx.quadraticCurveTo(boxX + boxSize, boxY + boxSize, boxX + boxSize - radius, boxY + boxSize);
                    ctx.lineTo(boxX + radius, boxY + boxSize);
                    ctx.quadraticCurveTo(boxX, boxY + boxSize, boxX, boxY + boxSize - radius);
                    ctx.lineTo(boxX, boxY + radius);
                    ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
                    ctx.fill();

                    ctx.shadowColor = 'transparent'; 

                    const qrContainer = document.createElement('div');
                    tempDiv.appendChild(qrContainer);
                    
                    const qrUrl = `${baseUrl}?student=${s.token}`;
                    
                    await new Promise(resolve => {
                        new QRCode(qrContainer, {
                            text: qrUrl,
                            width: 580,
                            height: 580,
                            colorDark : "#0f172a", 
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.H
                        });
                        setTimeout(resolve, 100); 
                    });

                    const qrCanvas = qrContainer.querySelector('canvas');
                    if (qrCanvas) {
                        ctx.drawImage(qrCanvas, boxX + 50, boxY + 50, 580, 580);
                    }

                    ctx.fillStyle = '#1e293b'; 
                    ctx.font = 'bold 56px Poppins, sans-serif';
                    ctx.fillText(s.name, canvas.width / 2, 1280);

                    ctx.fillStyle = '#64748b'; 
                    ctx.font = '500 28px Poppins, sans-serif';
                    ctx.fillText("Scan QR untuk melihat progress", canvas.width / 2, 1340);

                    const dataUrl = canvas.toDataURL('image/png');
                    const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
                    
                    const safeName = s.name.replace(/[^a-z0-9]/gi, '_');
                    const safeClass = s.class.replace(/[^a-z0-9]/gi, '_');
                    
                    zip.file(`QR_${safeName}_${safeClass}.png`, base64Data, {base64: true});
                }

                document.body.removeChild(tempDiv);

                const content = await zip.generateAsync({type: "blob"});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `QR_Santri_Assaadah_${Date.now()}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast(`Berhasil mengunduh ${studentsToDownload.length} QR Code HD!`, 'success');
                
                const selectAllCb = document.getElementById('selectAllQR');
                if(selectAllCb) selectAllCb.checked = false;
                document.querySelectorAll('.student-qr-cb').forEach(cb => cb.checked = false);
                updateBulkQRButton();

            } catch (err) {
                console.error(err);
                showToast('Terjadi kesalahan saat membuat file ZIP.', 'error');
            } finally {
                showLoading(false);
            }
        }

        window.printSingleQR = function() {
            document.body.classList.add('is-printing-single');
            window.print();
            setTimeout(() => document.body.classList.remove('is-printing-single'), 500);
        }

        function openQrModal(name, token, photoUrl) {
            const baseUrl = window.location.origin + window.location.pathname;
            const qrUrl = `${baseUrl}?student=${token}`;
            
            const modalHtml = `
                <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full relative animate-slide-up text-center shadow-2xl mx-auto my-auto">
                    <button onclick="closeModal()" class="absolute top-3 right-3 p-2 text-slate-400 hover:bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
                    
                    <div id="print-area" class="border-2 border-dashed border-emerald-200 rounded-2xl p-6 bg-emerald-50/30 mb-6 mt-4 relative">
                        <img src="${TPQ_LOGO}" alt="Logo TPQ" class="w-8 h-8 mx-auto mb-2 opacity-90 object-contain">
                        <h4 class="font-extrabold text-emerald-800 text-sm tracking-wider mb-1">AS-SA'ADAH</h4>
                        <p class="text-[9px] font-bold text-emerald-600 uppercase mb-4 tracking-widest">Kartu Hafalan Digital</p>
                        
                        <div class="bg-white p-3 rounded-2xl shadow-md inline-block mb-3 border border-slate-100" id="qrcode-container"></div>
                        
                        <h2 class="font-bold text-slate-800 text-base leading-tight mt-1">${name}</h2>
                        <p class="text-[9px] text-slate-500 mt-1.5 font-medium">Scan QR untuk melihat progress</p>
                    </div>

                    <button onclick="printSingleQR()" class="w-full bg-emerald-600 text-white py-3 rounded-2xl text-xs font-bold shadow-md shadow-emerald-600/30 flex items-center justify-center gap-2 hover:bg-emerald-700 transition-colors"><i data-lucide="printer" class="w-4 h-4"></i> Cetak Kartu QR Tunggal</button>
                </div>
            `;
            openModal(modalHtml);
            
            setTimeout(() => {
                new QRCode(document.getElementById("qrcode-container"), { text: qrUrl, width: 140, height: 140, colorDark : "#0f172a", colorLight : "#ffffff" });
            }, 100);
        }

        function logout() { state.currentUser = null; renderLogin(); }

        function goToHome() {
            if (state.currentUser) renderAdminLayout('dashboard');
            else renderLogin();
        }

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('student')) renderStudentProgress(urlParams.get('student'));
            else renderLogin();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
