<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As-Sa'adah | Progress Hafalan TKQ/TPQ</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->

    <!-- Lucide Icons -->

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Poppins', 'sans-serif'],

    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        html { scroll-behavior: smooth; }
        
        .progress-stripe {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.2) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.2) 75%, transparent 75%, transparent);

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .accordion-content { transition: max-height 0.2s ease-out, opacity 0.2s ease-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 2000px; opacity: 1; }
        
        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; padding: 2px; }

        /* Style Khusus Tabel Print & Rekap Absen Matrix */
        .matrix-table { width: 100%; border-collapse: collapse; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fff;}
        .matrix-table th, .matrix-table td { border: 1px solid #000; padding: 4px 2px; text-align: center; font-size: 9px; color: #000;}
        .matrix-table th { font-weight: bold; }
        .matrix-table .col-no { width: 22px; min-width: 22px; }
        .matrix-table .col-date { width: 16px; min-width: 16px; max-width: 16px; }
        .matrix-table .col-sum { width: 18px; min-width: 18px; max-width: 18px; }
        
        /* Toggle Switch Custom */
        input:checked ~ .dot { transform: translateX(100%); background-color: #fff; }
        input:checked ~ .bg-slate-200 { background-color: #ef4444; border-color: #ef4444; }
        .dot { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col relative selection:bg-emerald-200 selection:text-emerald-900">

    <script>
        // TEMPELKAN URL WEB APP GOOGLE SCRIPT DI SINI 
        const API_URL = "https://script.google.com/macros/s/AKfycbxW8k8FomDMxPVirAisEHDdHmc8KPpcgCP-14qVIRyVEHd_L_Z8wPTSVMbY7IsM3pjn/exec"; 

        const TPQ_LOGO = "https://cdn.phototourl.com/member/2026-09-08-92a66d20-b9c8-48ce-a051-79bf5c379dc3.png";
        const AVATAR_L = "https://cdn.phototourl.com/free/2026-09-10-3b329aa0-bcd0-4e7c-b2fb-436446f1df2f.png";
        const AVATAR_P = "https://cdn.phototourl.com/free/2026-09-10-83a53473-e09c-413e-a624-98ed3b0a0be2.png";

        window.toArabic = (num) => num.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
        window.getTodayStr = () => { const tzOffset = (new Date()).getTimezoneOffset() * 60000; return (new Date(Date.now() - tzOffset)).toISOString().split('T')[0]; };

            const d = new Date(); const m = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;

        const SURAHS_ARABIC = [
            "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"
        ];

        // State Global Cache (Optimistic UI) & Guard Bug
        const state = {
            currentUser: null, 
            currentMenu: '', // Guard mencegah bug jump loncat halaman
            materials: [], students: [], classes: [], teachers: [],
            ngajiLogs: [], absensiLogs: [], liburLogs: [],
            settings: { GLOBAL_PDF_URL: '', KEPALA_SEKOLAH: '', LOKASI_TTD: '', KATEGORI_MATERI: 'DOA HARIAN,SURAT PENDEK' },
            activeCategoryTab: 'SEMUA', activeClassTab: 'SEMUA', activeNgajiClassTab: 'SEMUA'
        };

        const appDiv = document.getElementById('app');

        /* STREAMING_CHUNK: API Helpers */
        async function fetchApi(action, params = {}, method = 'GET', body = null) {
            if (!API_URL || API_URL === "TEMPEL_URL_API_DISINI") {
                console.error("API_URL Belum Diatur di Script!");
                return { success: false, message: "Aplikasi belum terhubung ke Server (Cek API_URL)." };
            }
            let url = `${API_URL}?action=${action}`;
            if (method === 'GET' && Object.keys(params).length > 0) {
                url += '&' + new URLSearchParams(params).toString();
            }
            try {
                const options = { method };
                if (method === 'POST') {
                    options.body = JSON.stringify(body);
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                }
                const res = await fetch(url, options);
                if (!res.ok) throw new Error('Koneksi Gagal');
                return await res.json();
            } catch (e) {
                return { success: false, message: "Koneksi ke server bermasalah." };
            }
        }
        const apiGet = (action, params) => fetchApi(action, params, 'GET');
        const apiPost = (action, body) => fetchApi(action, {}, 'POST', body);

        /* STREAMING_CHUNK: Utilities */
        window.logout = function() {
            state.currentUser = null;
            state.currentMenu = '';
            renderLogin();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-slate-800');
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'x-circle' : 'info');
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto mt-2 z-[100]`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i><p class="text-sm font-medium leading-tight">${message}</p>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-10px]'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function setBtnLoading(btn, isLoading, originalHtml = '') {
            if (isLoading) {
                btn.dataset.original = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline-block"></i> <span class="ml-1">Proses...</span>`;
                btn.disabled = true; btn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                btn.innerHTML = btn.dataset.original || originalHtml;
                btn.disabled = false; btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
            lucide.createIcons();
        }

        function openModal(htmlContent) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = htmlContent; modal.classList.replace('hidden', 'flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10); lucide.createIcons();
        }
        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('opacity-0'); setTimeout(() => { modal.classList.replace('flex', 'hidden'); modal.innerHTML = ''; }, 200);
        }
        function openSubModal(htmlContent) {
            const modal = document.getElementById('sub-modal-container');
            modal.innerHTML = htmlContent; modal.classList.replace('hidden', 'flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10); lucide.createIcons();
        }
        function closeSubModal() {
            const modal = document.getElementById('sub-modal-container');
            modal.classList.add('opacity-0'); setTimeout(() => { modal.classList.replace('flex', 'hidden'); modal.innerHTML = ''; }, 200);
        }

        /* STREAMING_CHUNK: Progress/Learning Module (Siswa) */
        function generateStudentProgressHtml(data) {
            const grouped = data.materials.reduce((acc, curr) => {
                if(!acc[curr.category]) acc[curr.category] = [];
                acc[curr.category].push(curr); return acc;
            }, {});

            let matHTML = '';
            for (const [category, items] of Object.entries(grouped)) {
                const catId = `cat-${Math.random().toString(36).substr(2, 9)}`;
                const hafalCount = items.filter(i => i.status === 'HAFAL').length;
                const totalCount = items.length;
                const isAllHafal = hafalCount === totalCount && totalCount > 0;
                
                matHTML += `
                <div class="mb-3 animate-slide-up category-group">
                    <div class="bg-white rounded-2xl shadow-sm border ${isAllHafal ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-100'} overflow-hidden">
                        <button onclick="toggleAccordion('${catId}')" class="w-full flex items-center justify-between p-4 focus:outline-none hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${isAllHafal ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'} flex items-center justify-center transition-colors">
                                    <i data-lucide="${isAllHafal ? 'check-circle' : 'book-open'}" class="w-4 h-4"></i>
                                </div>
                                <div class="text-left"><h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider leading-none">${category}</h3><p class="text-[10px] font-bold mt-1 ${isAllHafal ? 'text-emerald-600' : 'text-slate-400'}">${hafalCount} dari ${totalCount} Selesai</p></div>
                            </div>
                            <i data-lucide="chevron-down" id="icon-${catId}" class="w-5 h-5 text-slate-400 transform transition-transform duration-200"></i>
                        </button>
                        <div id="${catId}" class="accordion-content border-t border-slate-50 divide-y divide-slate-50">
                `;
                
                items.forEach(m => {
                    let badgeClass = m.status === 'HAFAL' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : m.status === 'PROSES' ? 'bg-amber-50 text-amber-600 border-amber-100' : 'bg-slate-50 text-slate-400 border-slate-100';
                    let dotColor = m.status === 'HAFAL' ? 'bg-emerald-500' : m.status === 'PROSES' ? 'bg-amber-500' : 'bg-slate-300';
                    matHTML += `
                        <div class="material-item public-material-item flex justify-between items-center p-3 pl-5 hover:bg-slate-50/50 transition-colors cursor-pointer" onclick="openLearningModal('${m.id}')" data-status="${m.status}">
                            <div class="flex items-center gap-3 flex-grow pr-3"><div class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0 shadow-sm transition-colors"></div><div><p class="text-sm font-semibold text-slate-700 leading-tight">${m.name}</p><p class="text-[9px] text-slate-400 mt-0.5">Ketuk untuk detail</p></div></div>
                            <span class="shrink-0 px-2.5 py-1 text-[9px] font-bold rounded-lg border transition-colors ${badgeClass}">${m.status}</span>
                        </div>`;
                });
                matHTML += `</div></div></div>`;
            }

            let avatarSrc = data.student.gender === 'P' ? AVATAR_P : AVATAR_L;
            if(data.student.photo && data.student.photo.trim() !== '') avatarSrc = data.student.photo;

           const absBadgeHtml = data.absInfo.text ? `<div class="bg-${data.absInfo.color}-100 text-${data.absInfo.color}-600 border border-${data.absInfo.color}-200 text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm max-w-[120px] truncate">HARI INI (${data.absInfo.text})</div>` : '';
const ngajiBadgeHtml = data.lastNgajiText ? `<div class="bg-emerald-500 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-md max-w-[120px] truncate border border-emerald-400" title="${data.lastNgajiText}">${data.lastNgajiText}</div>` : '';

return `
    <div class="bg-gradient-to-br from-emerald-600 via-emerald-500 to-teal-700 text-white pt-6 pb-32 px-6 relative overflow-hidden shrink-0 shadow-sm">

                    <div class="absolute top-0 right-0 p-4 opacity-10 transform translate-x-4 -translate-y-4"><i data-lucide="award" class="w-48 h-48"></i></div>
                    <div class="absolute top-5 right-5 flex gap-2 z-20">
                        <button onclick="openPdf()" class="p-2 bg-white/20 hover:bg-white/30 rounded-full backdrop-blur-md transition-colors text-white border border-white/30 shadow-sm" title="Baca Materi Lengkap"><i data-lucide="book-open" class="w-5 h-5"></i></button>
                    </div>
                    <div class="relative z-10 text-center animate-slide-down flex flex-col items-center">
                        <img src="${TPQ_LOGO}" alt="Logo" class="w-14 h-14 object-contain mb-2 drop-shadow-md">
                        <h1 class="text-xl font-bold tracking-wider mb-1 drop-shadow-sm">AS-SA'ADAH</h1>
                        <p class="text-emerald-100 text-[10px] uppercase font-bold tracking-widest drop-shadow-sm">Buku Prestasi Digital</p>
                    </div>
                </div>
                <div class="px-4 -mt-20 relative z-20 pb-12 max-w-md mx-auto w-full flex-grow">
                    <div class="glass rounded-[2rem] p-6 shadow-2xl shadow-emerald-900/10 mb-6 text-center relative animate-slide-up">
                        <div class="absolute top-4 right-4 flex flex-col gap-1 items-end">
    ${ngajiBadgeHtml}
    ${absBadgeHtml}
</div>

                        <img src="${avatarSrc}" class="w-20 h-20 mx-auto object-cover rounded-full -mt-14 mb-3 border-4 border-white shadow-lg bg-white">
                        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight leading-none">${data.student.name}</h2>
                        <div class="flex justify-center gap-2 mt-2">
                            <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-semibold border border-emerald-100">${data.student.class}</span>
                            <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-semibold border border-blue-100">${data.student.ngaji || 'IQRA'}</span>
                        </div>
                        <div class="mt-6">
                            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2"><span>Total Hafalan</span><span class="text-emerald-600 text-sm">${data.stats.percentage}%</span></div>
                            <div class="w-full bg-slate-100 rounded-full h-3 mb-4 overflow-hidden shadow-inner p-0.5"><div class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full progress-stripe transition-all duration-1000 ease-out" style="width: ${data.stats.percentage}%"></div></div>
                            <div class="flex gap-2 overflow-x-auto hide-scroll justify-center pb-1 mt-4">
                                <button onclick="filterPublicProgress('SEMUA', this)" class="pub-filter-btn bg-slate-800 text-white shadow-sm px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all">Semua</button>
                                <button onclick="filterPublicProgress('HAFAL', this)" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all">Hafal (${data.stats.hafal})</button>
                                <button onclick="filterPublicProgress('PROSES', this)" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all">Proses (${data.stats.proses})</button>
                                <button onclick="filterPublicProgress('BELUM', this)" class="pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all">Belum (${data.stats.belum})</button>
                            </div>
                        </div>
                    </div>
                    <div id="materials-container">${matHTML}</div>
                </div>`;
        }

        async function renderStudentProgress(token) {
            appDiv.innerHTML = `<div class="flex-grow flex flex-col items-center justify-center p-6 text-center bg-slate-50 h-[100dvh]"><div class="w-10 h-10 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div><p class="text-emerald-600 font-bold text-sm animate-pulse-fast">Memuat Data...</p></div>`;
            const response = await apiGet('getStudentProgress', { token });
            if (!response.success) {
                appDiv.innerHTML = `<div class="flex-grow flex flex-col items-center justify-center p-6 text-center bg-slate-50 h-[100dvh]"><div class="w-24 h-24 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-6 shadow-lg"><i data-lucide="shield-alert" class="w-12 h-12"></i></div><h2 class="text-xl font-bold text-slate-800 mb-2">Data Tidak Ditemukan</h2><p class="text-slate-500 text-sm">${response.message}</p></div>`;
                lucide.createIcons(); return;
            }
            state.materials = response.data.materials;
            state.settings.GLOBAL_PDF_URL = response.data.globalPdfUrl;
            appDiv.innerHTML = generateStudentProgressHtml(response.data);
            lucide.createIcons();
        }

        window.openPdf = function() {
            if (!state.settings.GLOBAL_PDF_URL) return showToast('Link PDF Materi belum dikonfigurasi.', 'error');
            let url = state.settings.GLOBAL_PDF_URL.startsWith('http') ? state.settings.GLOBAL_PDF_URL : 'https://' + state.settings.GLOBAL_PDF_URL;
            window.open(url, '_blank');
        }

        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if(!content) return;
            if(content.classList.contains('open')) { content.classList.remove('open'); if(icon) icon.style.transform = 'rotate(0deg)'; } 
            else { content.classList.add('open'); if(icon) icon.style.transform = 'rotate(180deg)'; }
        }

        window.filterPublicProgress = function(status, btnElement) {
            document.querySelectorAll('.pub-filter-btn').forEach(btn => btn.className = 'pub-filter-btn bg-slate-50 border border-slate-200 text-slate-500 px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all');
            btnElement.className = 'pub-filter-btn bg-slate-800 text-white shadow-sm px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all';

            document.querySelectorAll('.public-material-item').forEach(item => item.style.display = (status === 'SEMUA' || item.dataset.status === status) ? 'flex' : 'none');
            
            document.querySelectorAll('.category-group').forEach(group => {
                const visible = Array.from(group.querySelectorAll('.public-material-item')).filter(i => i.style.display !== 'none');
                group.style.display = visible.length === 0 ? 'none' : 'block';
                
                const content = group.querySelector('.accordion-content');
                const icon = group.querySelector('i[data-lucide="chevron-down"]');
                
                if (status === 'SEMUA') {
                    content.classList.remove('open');
                    if(icon) icon.style.transform = 'rotate(0deg)';
                } else if (visible.length > 0) {
                    content.classList.add('open');
                    if(icon) icon.style.transform = 'rotate(180deg)';
                }
            });
        }

        window.openLearningModal = function(materialId) {
            const m = state.materials.find(x => x.id === materialId);
            if(!m) return;
            
            const hasDesc = m.desc && m.desc.trim() !== '';
            const hasArabic = m.arabic && m.arabic.trim() !== '';
            const hasLatin = m.latin && m.latin.trim() !== '';
            const hasArti = m.arti && m.arti.trim() !== '';
            const hasImage = m.image && m.image.trim() !== '';

            let formattedArabic = '';
            if (hasArabic) {
                const verses = m.arabic.split('-').map(v => v.trim()).filter(v => v.length > 0);
                if (verses.length > 1) {
                    formattedArabic = verses.map((verse, idx) => {
                        const mappedNum = window.toArabic(idx + 1);
                        return `${verse} <span class="inline-flex items-center justify-center min-w-[28px] h-[28px] rounded-full border-2 border-emerald-400 text-emerald-600 text-[13px] font-bold mx-1.5 bg-emerald-50 shadow-sm leading-none font-sans" dir="ltr">${mappedNum}</span>`;
                    }).join(' ');
                } else formattedArabic = m.arabic;
            }

            const isEmpty = !hasDesc && !hasArabic && !hasLatin && !hasArti && !hasImage;
            const isMainModalOpen = !document.getElementById('modal-container').classList.contains('hidden');
            const closeAction = isMainModalOpen ? 'closeSubModal()' : 'closeModal()';

            const modalHtml = `
                <div class="bg-white rounded-t-[2.5rem] md:rounded-3xl w-full max-w-md mt-auto md:mt-0 p-6 shadow-2xl relative animate-slide-up flex flex-col max-h-[85vh]">

                    <div class="flex justify-between items-start mt-4 md:mt-0 mb-6 shrink-0">
                        <div><span class="text-[10px] font-bold text-emerald-500 uppercase tracking-wider">${m.category}</span><h3 class="text-xl font-extrabold text-slate-800 leading-tight mt-1">${m.name}</h3></div>

                    <div class="overflow-y-auto hide-scroll pb-6 space-y-6">
                        ${hasImage ? `<img src="${m.image}" class="w-full rounded-2xl border border-slate-100 object-cover shadow-sm">` : ''}
                        ${hasDesc ? `<div class="bg-slate-50 p-4 rounded-2xl border border-slate-100"><p class="text-xs text-slate-600 leading-relaxed font-medium"><i data-lucide="lightbulb" class="w-4 h-4 inline-block text-amber-500 mr-1 mb-1"></i> ${m.desc}</p></div>` : ''}
                        ${hasArabic ? `<div class="text-right bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100/50"><p class="text-2xl font-bold text-slate-800 leading-[2.5] font-arabic" dir="rtl">${formattedArabic}</p></div>` : ''}
                        ${hasLatin ? `<div><h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Cara Membaca (Latin)</h4><p class="text-sm font-semibold text-slate-700 leading-relaxed italic">${m.latin}</p></div>` : ''}
                        ${hasArti ? `<div><h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Terjemahan</h4><p class="text-sm text-slate-600 leading-relaxed">${m.arti}</p></div>` : ''}
                        ${isEmpty ? `<div class="text-center py-10 opacity-50"><i data-lucide="book" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i><p class="text-sm font-medium">Detail belum tersedia.</p></div>` : ''}

                        apiGet('getMaterials'),
                        apiGet('getSettings'),
                        apiGet('getClasses'),
                        apiGet('getNgajiAbsensiLogs')
                    ]);
                    if(resStu.success) state.students = resStu.data;
                    if(resMat.success) state.materials = resMat.data;

                    if(resClasses.success) state.classes = resClasses.data;

        window.saveAbsensi = async function(btn) {
            const date = document.getElementById('abs-date').value;
            const cls = document.getElementById('abs-class').value;
            const isLibur = document.getElementById('toggle-libur').checked;
            const ket = document.getElementById('libur-ket').value.trim() || 'LIBUR';

            setBtnLoading(btn, true, `<i data-lucide="save" class="w-4 h-4"></i> Simpan Data`);
            
            // Update Local State (Optimistic)
            state.liburLogs = state.liburLogs.filter(l => !(l.date === date && l.class === cls));
            state.absensiLogs = state.absensiLogs.filter(l => !(l.date === date && l.class === cls));

            let logsToSave = [];
            if (isLibur) {
                state.liburLogs.push({ date, class: cls, ket: ket.toUpperCase() });
            } else {
                document.querySelectorAll('#abs-form-list > .abs-row').forEach(row => {
                    const studentId = row.dataset.studentid;
                    const activeBtn = row.querySelector('.text-white');
                    const status = activeBtn ? activeBtn.dataset.val : 'H';
                    const newLog = { id: Date.now()+Math.random(), date, class: cls, studentId, status };
                    state.absensiLogs.push(newLog);
                    logsToSave.push(newLog);
                });
            }
            
            apiPost('saveAbsensiBatch', { date, cls, isLibur, ket: ket.toUpperCase(), logs: logsToSave }).then(() => {
                closeModal();
                showToast('Data Absensi/Libur disimpan!', 'success');

        }

        window.renderAbsensiTable = function(monthStr, year, monthIndex) {
            const cls = document.getElementById('view-abs-class').value;
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            
            // Format "KELAS : TPQ A" tanpa teks ganda
            const clsClean = cls.replace(/kelas\s+/i, '').trim();

            document.getElementById('lbl-kop-tahun').innerText = `TKQ-TPQ AS-SA'ADAH TAHUN ${year}`;
            document.getElementById('lbl-kelas-garis').innerText = clsClean;
            document.getElementById('lbl-bulan-garis').innerText = `${monthNames[monthIndex]} ${year}`;
            
            const students = state.students.filter(s => s.class === cls);
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            const holidaysThisMonth = state.liburLogs.filter(l => l.date.startsWith(monthStr) && l.class === cls);
            
            let html = `
                <thead>
                    <tr>
                        <th rowspan="2" class="col-no">NO</th>
                        <th rowspan="2" class="text-left px-2 w-48">N A M A</th>
                        <th colspan="31">TANGGAL</th>
                        <th colspan="4">JUMLAH</th>
                    </tr>
                    <tr>
            `;
            for(let i=1; i<=31; i++) html += `<th class="col-date">${i}</th>`;
            html += `<th class="col-sum">H</th><th class="col-sum">S</th><th class="col-sum">I</th><th class="col-sum">A</th></tr></thead><tbody>`;

            if(students.length === 0) {
                html += `<tr><td colspan="37" class="py-4 text-slate-400 border border-slate-300">Tidak ada santri.</td></tr></tbody>`;
                document.getElementById('abs-matrix-table').innerHTML = html;
                return;
            }

            students.forEach((s, sIdx) => {
                const logs = state.absensiLogs.filter(l => l.studentId === s.id && l.date.startsWith(monthStr));
                const sumH = logs.filter(l => l.status === 'H').length;
                const sumS = logs.filter(l => l.status === 'S').length;
                const sumI = logs.filter(l => l.status === 'I').length;
                const sumA = logs.filter(l => l.status === 'A').length;

                html += `<tr><td>${sIdx+1}</td><td style="text-align: left; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;">${s.name}</td>`;
                
                for(let d=1; d<=31; d++) {
                    if (d > daysInMonth) {
                        html += `<td style="background-color: #f1f5f9;"></td>`; 
                        continue;
                    }
                    
                    const currentDate = `${monthStr}-${String(d).padStart(2,'0')}`;
                    const holiday = holidaysThisMonth.find(h => h.date === currentDate);
                    
                    // Deteksi hari Sabtu & Minggu (0 = Minggu, 6 = Sabtu)
                    const dDate = new Date(year, monthIndex, d);
                    const isWeekend = (dDate.getDay() === 0 || dDate.getDay() === 6);
                    
                    if (isWeekend) {
                        html += `<td style="background-color: #fee2e2; color: #dc2626;"></td>`;
                    } else if (holiday) {
                        const letter = holiday.ket[sIdx] || '';
                        html += `<td style="background-color: #fee2e2; color: #dc2626; font-weight: bold; font-style: italic;">${letter}</td>`;
                    } else {
                        const log = logs.find(l => l.date === currentDate);
                        let mark = '';
                        if (log) {
                            if (log.status === 'H') mark = '&#10003;'; 
                            else mark = log.status; 
                        }
                        html += `<td>${mark}</td>`;
                    }
                }
                
                html += `<td>${sumH||''}</td><td>${sumS||''}</td><td>${sumI||''}</td><td>${sumA||''}</td></tr>`;
            });

            html += `</tbody>`;
            document.getElementById('abs-matrix-table').innerHTML = html;
        }

        }

        window.saveStudent = function(id, btn) {
            const name = document.getElementById('fs-name').value.trim();
            if(!name) return showToast('Nama wajib diisi', 'error');
            
            // BUG FIX: Generate & simpan token dengan benar
            let token = 'tok' + Date.now() + Math.floor(Math.random()*1000);
            if (id) {
                const existing = state.students.find(x => x.id === id);
                if (existing && existing.token) token = existing.token;
            }

            setBtnLoading(btn, true, 'Simpan');
            const data = { 
                id: id||'s'+Date.now(), name, 
                class: document.getElementById('fs-class').value, 
                gender: document.getElementById('fs-gender').value, 
                ngaji: document.getElementById('fs-ngaji').value, 
                photo: document.getElementById('fs-photo').value,
                token: token
            };
            
            apiPost(id?'updateStudent':'addStudent', data).then(() => {
                if(id) { const idx = state.students.findIndex(x=>x.id===id); state.students[idx] = {...state.students[idx], ...data}; }

        window.processImportStudent = function(btn) {
            const txt = document.getElementById('import-student-csv').value.trim();
            const cls = document.getElementById('import-student-class').value;
            if(!txt) return showToast('Data CSV kosong', 'error');
            
            const lines = txt.split('\n');
            let newStudents = [];
            lines.forEach((l, i) => {
                const p = l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.trim().replace(/^"|"$/g, ''));
                if(p.length >= 3 && p[0]) {
                    newStudents.push({
                        id: 's'+Date.now()+i, 
                        name: p[0], 
                        class: cls,
                        gender: p[1].toUpperCase() === 'P' ? 'P' : 'L',
                        ngaji: p[2].toUpperCase().includes('QURAN') ? 'AL QURAN' : 'IQRA',
                        token: 'tok' + Date.now() + i + Math.floor(Math.random()*100),
                        photo: p[3] || ''
                    });
                }
            });

            if(newStudents.length===0) return showToast('Format salah (Cek Panduan Placeholder)', 'error');
            
            setBtnLoading(btn, true, 'Import Data');
            apiPost('importStudents', { students: newStudents }).then(() => {
                state.students = [...state.students, ...newStudents];
                closeModal(); showToast(`Berhasil import ${newStudents.length} siswa!`, 'success'); loadStudentsAdmin();
            });
        }

        /* STREAMING_CHUNK: Canvas Card Generator */
        async function getQrCanvas(url, width) {
            return new Promise(resolve => {
                const div = document.createElement('div');
                new QRCode(div, { text: url, width: width, height: width, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
                setTimeout(() => resolve(div.querySelector('canvas')), 50);
            });
        }

        async function createFullCardCanvas(name, className, token) {
            const canvas = document.createElement('canvas'); canvas.width = 1050; canvas.height = 1485; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.setLineDash([20, 15]); ctx.beginPath(); ctx.moveTo(0, canvas.height - 4); ctx.lineTo(canvas.width, canvas.height - 4); ctx.lineWidth = 8; ctx.strokeStyle = '#6ee7b7'; ctx.stroke(); ctx.setLineDash([]); 
            
            const logoImg = await new Promise(r => { const img = new Image(); img.crossOrigin = "Anonymous"; img.onload = () => r(img); img.onerror = () => r(null); img.src = TPQ_LOGO; });
            if (logoImg) ctx.drawImage(logoImg, (canvas.width - 130) / 2, 140, 130, 130);
            
            ctx.textAlign = 'center'; ctx.fillStyle = '#064e3b'; ctx.font = '900 48px Poppins, sans-serif'; ctx.fillText("AS-SA'ADAH", canvas.width / 2, 350);
            ctx.fillStyle = '#059669'; ctx.font = 'bold 24px Poppins, sans-serif'; ctx.fillText("KARTU HAFALAN DIGITAL", canvas.width / 2, 410);

            const boxSize = 680, boxX = (canvas.width - boxSize) / 2, boxY = 480, r = 50;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.06)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 15; ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.moveTo(boxX + r, boxY); ctx.lineTo(boxX + boxSize - r, boxY); ctx.quadraticCurveTo(boxX + boxSize, boxY, boxX + boxSize, boxY + r); ctx.lineTo(boxX + boxSize, boxY + boxSize - r); ctx.quadraticCurveTo(boxX + boxSize, boxY + boxSize, boxX + boxSize - r, boxY + boxSize); ctx.lineTo(boxX + r, boxY + boxSize); ctx.quadraticCurveTo(boxX, boxY + boxSize, boxX, boxY + boxSize - r); ctx.lineTo(boxX, boxY + r); ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY); ctx.fill(); ctx.shadowColor = 'transparent'; 

            const qrUrl = `${window.location.origin + window.location.pathname}?student=${token}`;
            const qrCanvas = await getQrCanvas(qrUrl, 580);
            if (qrCanvas) ctx.drawImage(qrCanvas, boxX + 50, boxY + 50, 580, 580);
            
            ctx.fillStyle = '#1e293b'; ctx.font = 'bold 56px Poppins, sans-serif'; ctx.fillText(name, canvas.width / 2, 1280);
            ctx.fillStyle = '#059669'; ctx.font = 'bold 32px Poppins, sans-serif'; ctx.fillText(className, canvas.width / 2, 1340);
            return canvas;
        }

        async function createMiniQRCanvas(name, className, token) {
            const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 500; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const qrUrl = `${window.location.origin + window.location.pathname}?student=${token}`;
            const qrCanvas = await getQrCanvas(qrUrl, 320);
            if (qrCanvas) ctx.drawImage(qrCanvas, 40, 40, 320, 320);
            
            ctx.textAlign = 'center'; 
            ctx.fillStyle = '#1e293b'; ctx.font = 'bold 22px Poppins, sans-serif'; ctx.fillText(name, canvas.width / 2, 420);
            ctx.fillStyle = '#64748b'; ctx.font = '500 16px Poppins, sans-serif'; ctx.fillText(className, canvas.width / 2, 450);
            return canvas;
        }

        window.downloadBulkQR = async function() {

            const studentsToDownload = state.students.filter(s => selected.includes(s.token));

            try {
                const zip = new JSZip();
                if (document.fonts) await document.fonts.ready;

                for (let i = 0; i < studentsToDownload.length; i++) {
                    const s = studentsToDownload[i];
                    const canvas = await createMiniQRCanvas(s.name, s.class, s.token);

            const inputFields = isQuran ? `

                <div class="flex justify-between items-center p-5 bg-white border-b border-slate-100 shrink-0 shadow-sm z-20">

                    </div>
                    <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-50 hover:bg-slate-100 rounded-full text-slate-500 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tanggal</label>
                            <input type="date" id="ngaji-tgl" value="${window.getTodayStr()}" onchange="renderNgajiTable('${student.id}')" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-slate-50 text-center outline-none focus:border-emerald-500 transition-colors cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ket / Hasil</label>

                                <option value="Lanjut">Lanjut</option>
                                <option value="Ulang">Ulang</option>

        window.renderNgajiTable = function(studentId) {
            const selectedDate = document.getElementById('ngaji-tgl').value;
            const logs = state.ngajiLogs.filter(x => x.studentId === studentId && x.date === selectedDate).sort((a,b) => b.id - a.id);
            const tbody = document.getElementById('ngaji-tbody');
            if(!tbody) return;
            
            if(logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 font-medium"><i data-lucide="book-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di hari ini.</td></tr>`;
                lucide.createIcons(); return;
            }
            
            let html = '';
            logs.forEach((log, index) => {
                const isQuran = log.type === 'AL QURAN';
                const targetStr = isQuran ? log.target : window.toArabic(log.target);
                const ketClass = log.ket === 'Lanjut' ? 'text-emerald-600 bg-emerald-100 border border-emerald-200' : 'text-amber-600 bg-amber-100 border border-amber-200';
                const paraf = log.teacher.replace('Ust. ', '').replace('Usth. ', '').split(' ')[0];
                const ayatHal = isQuran ? `${window.toArabic(log.dari)} - ${window.toArabic(log.sampai)}` : window.toArabic(log.dari);
                
                html += `
                <tr class="hover:bg-white transition-colors">
                    <td class="p-3 text-center font-bold text-slate-400">${logs.length - index}</td>
                    <td class="p-3 font-bold ${isQuran?'font-arabic text-sm text-right':'text-center'} text-slate-800" ${isQuran?'dir="rtl"':''}>${targetStr}</td>
                    <td class="p-3 text-center font-arabic font-bold text-slate-700 text-sm" dir="rtl">${ayatHal}</td>
                    <td class="p-3 text-center"><span class="${ketClass} px-2 py-1 rounded-md text-[8px] font-bold shadow-sm">${log.ket}</span></td>
                    <td class="p-3 text-center text-slate-500 font-medium truncate max-w-[60px]" title="${log.teacher}">${paraf}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.saveNgajiEntry = function(studentId, btn) {
            const tgl = document.getElementById('ngaji-tgl').value;
            const target = document.getElementById('ngaji-target').value;
            const dari = document.getElementById('ngaji-dari').value;
            const sampaiEl = document.getElementById('ngaji-sampai');
            const ket = document.getElementById('ngaji-ket').value;
            const student = state.students.find(s => s.id === studentId);
            
            const payload = {
                id: Date.now(), studentId: studentId, date: tgl,
                type: student.ngaji || 'IQRA', target: target, dari: dari,
                sampai: sampaiEl ? sampaiEl.value : '-', ket: ket, teacher: state.currentUser.name
            };

            state.ngajiLogs.push(payload);
            setBtnLoading(btn, true, `<i data-lucide="save" class="w-4 h-4"></i> Simpan Data Ngaji`);
            apiPost('addNgajiLog', payload).then(() => {
                setBtnLoading(btn, false);
                showToast('Data Ngaji Tersimpan!', 'success');
                renderNgajiTable(studentId);
            });
        }

        /* --- Riwayat Detail (Ikon Mata) --- */
        window.openNgajiHistory = function(studentId, page = 1) {
            const student = state.students.find(s => s.id === studentId);
            const logs = state.ngajiLogs.filter(x => x.studentId === studentId).sort((a,b) => a.id - b.id);
            const isQuran = student.ngaji === 'AL QURAN';
            
            const pageSize = 15;
            const totalPages = Math.ceil(logs.length / pageSize) || 1;
            const pagedLogs = logs.slice((page-1)*pageSize, page*pageSize);

            let tableHtml = '';
            if(logs.length === 0) {
                tableHtml = `<tr><td colspan="6" class="text-center py-10 text-slate-400 font-medium"><i data-lucide="book-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada riwayat ngaji sama sekali.</td></tr>`;
            } else {
                pagedLogs.forEach((log, index) => {
                    const no = ((page-1)*pageSize) + index + 1; 
                    const targetStr = log.type === 'AL QURAN' ? log.target : window.toArabic(log.target);
                    const paraf = log.teacher.replace('Ust. ', '').replace('Usth. ', '').split(' ')[0];
                    const ayatHal = log.type === 'AL QURAN' ? `${window.toArabic(log.dari)} - ${window.toArabic(log.sampai)}` : window.toArabic(log.dari);
                    
                    tableHtml += `
                    <tr>
                        <td class="text-center font-medium">${no}</td>
                        <td class="font-medium text-xs">${window.formatDateID(log.date)}</td>
                        <td class="font-bold ${log.type==='AL QURAN'?'font-arabic text-sm text-right':'text-center'}" ${log.type==='AL QURAN'?'dir="rtl"':''}>${targetStr}</td>
                        <td class="text-center font-arabic font-bold text-sm" dir="rtl">${ayatHal}</td>
                        <td class="text-center text-xs font-semibold">${log.ket}</td>
                        <td class="text-center font-medium text-xs truncate max-w-[60px]" title="${log.teacher}">${paraf}</td>
                    </tr>`;
                });
            }

            const isPrevDisabled = page === 1;
            const isNextDisabled = page === totalPages;

            const modalHtml = `
            <div class="bg-slate-50 rounded-[2rem] w-full max-w-2xl shadow-2xl relative animate-slide-up mx-auto mt-auto md:my-auto h-[95dvh] md:h-[90vh] flex flex-col overflow-hidden">
                <div class="flex justify-between items-center p-5 bg-white border-b border-slate-100 shrink-0 shadow-sm z-20">
                    <div>
                       <h3 class="text-lg font-extrabold text-slate-800 leading-tight">Buku Prestasi (Riwayat Ngaji)</h3>
                       <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-wide mt-0.5">${student.name} • ${student.ngaji || 'IQRA'}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="downloadHistoryPDF('${student.id}')" class="w-8 h-8 flex items-center justify-center bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-full transition-colors" title="Download PDF"><i data-lucide="download" class="w-4 h-4"></i></button>
                        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-50 hover:bg-slate-100 rounded-full text-slate-500 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                </div>
                
                <div class="flex-grow overflow-y-auto hide-scroll relative p-6 bg-white flex flex-col">
                    <div id="pdf-view-area" class="bg-white">
                        <table class="w-full text-left text-xs whitespace-nowrap book-table border-collapse">
                            <thead>
                                <tr>
                                    <th class="w-10">No.</th>
                                    <th>Tanggal</th>
                                    <th>Nama Surat / Iqro Jilid</th>
                                    <th>Ayat / Hal</th>
                                    <th>Ket.</th>
                                    <th>Paraf Ustadz</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableHtml}
                            </tbody>
                        </table>
                    </div>
                    
                    ${logs.length > pageSize ? `
                    <div class="mt-auto pt-6 pb-2 flex items-center justify-between">
                        <p class="text-[10px] text-slate-400 font-bold">Halaman ${page} dari ${totalPages}</p>
                        <div class="flex gap-1">
                            <button onclick="openNgajiHistory('${student.id}', ${page-1})" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-colors ${isPrevDisabled?'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed':'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}" ${isPrevDisabled?'disabled':''}>Prev</button>
                            <button onclick="openNgajiHistory('${student.id}', ${page+1})" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-colors ${isNextDisabled?'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed':'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}" ${isNextDisabled?'disabled':''}>Next</button>
                        </div>
                    </div>` : ''}
                </div>
            </div>`;
            openModal(modalHtml);
        }

        window.downloadHistoryPDF = function(studentId) {
            const student = state.students.find(s => s.id === studentId);
            const logs = state.ngajiLogs.filter(x => x.studentId === studentId).sort((a,b) => a.id - b.id);
            const isQuran = student.ngaji === 'AL QURAN';
            showToast('Menyiapkan PDF, tunggu sebentar...', 'info');

            let fullTableHtml = '';
            logs.forEach((log, index) => {
                const no = index + 1; 
                const targetStr = log.type === 'AL QURAN' ? log.target : window.toArabic(log.target);
                const paraf = log.teacher.replace('Ust. ', '').replace('Usth. ', '').split(' ')[0];
                const ayatHal = log.type === 'AL QURAN' ? `${window.toArabic(log.dari)} - ${window.toArabic(log.sampai)}` : window.toArabic(log.dari);
                
                fullTableHtml += `
                <tr>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 11px;">${no}</td>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 11px;">${window.formatDateID(log.date)}</td>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 14px; font-family: 'Amiri', serif;" dir="${log.type==='AL QURAN'?'rtl':'ltr'}"><b>${targetStr}</b></td>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 14px; font-family: 'Amiri', serif;" dir="rtl"><b>${ayatHal}</b></td>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 11px;">${log.ket}</td>
                    <td style="border: 1px solid #1e293b; padding: 6px; text-align: center; font-size: 11px;">${paraf}</td>
                </tr>`;
            });

            // Format "KELAS : TPQ A" tanpa teks ganda
            const clsClean = student.class.replace(/kelas\s+/i, '').trim();

            const element = document.createElement('div');
            element.style.padding = '20px';
            element.style.backgroundColor = '#ffffff';
            element.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; font-size: 20px; font-family: 'Poppins', sans-serif;">BUKU PRESTASI NGAJI</h2>
                    <h3 style="margin: 0; font-size: 16px; font-family: 'Poppins', sans-serif; color: #16a34a;">TKQ/TPQ AS-SA'ADAH</h3>
                </div>
                <div style="margin-bottom: 15px; font-family: 'Poppins', sans-serif; font-size: 12px; display: flex; justify-content: space-between;">
                    <div><b>Nama:</b> ${student.name}</div>
                    <div><b>Kelas / Kategori:</b> ${clsClean} / ${student.ngaji||'IQRA'}</div>
                </div>
                <table style="width: 100%; border-collapse: collapse; font-family: 'Poppins', sans-serif;">
                    <thead>
                        <tr style="background-color: #f1f5f9;">
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">No.</th>
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">Tanggal</th>
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">Nama Surat / Iqro Jilid</th>
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">Ayat / Hal</th>
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">Ket.</th>
                            <th style="border: 1px solid #1e293b; padding: 8px; font-size: 12px;">Paraf Ustadz</th>
                        </tr>
                    </thead>
                    <tbody>${fullTableHtml}</tbody>
                </table>
            `;

            const opt = {
                margin:       10,
                filename:     `Buku_Prestasi_${student.name.replace(/\s+/g,'_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 1200 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        /* STREAMING_CHUNK: Master Data Admin */

            const content = document.getElementById('admin-content');
            const tabs = [ { id: 'materi', label: 'Materi', icon: 'book' }, { id: 'kelas', label: 'Kelas', icon: 'layout' }, { id: 'akun', label: 'Akun Guru', icon: 'users' }, { id: 'setting', label: 'Pengaturan', icon: 'settings' } ];

            lucide.createIcons();

                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-white text-slate-400 font-bold uppercase text-[10px] tracking-wider border-b border-slate-100"><tr><th class="px-6 py-4">Nama Kelas</th><th class="px-6 py-4 text-right">Aksi</th></tr></thead>
                        <tbody class="divide-y divide-slate-50 text-slate-700">
                            ${list.length === 0 ? `<tr><td colspan="2" class="text-center py-8 text-slate-500 text-sm">Tidak ada kelas.</td></tr>` : list.map(c => `
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="px-6 py-3 font-semibold text-slate-800">${c.name}</td>
                                    <td class="px-6 py-3 text-right"><button onclick="deleteClass('${c.id}')" class="p-2 text-slate-400 hover:text-rose-600 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }
        window.openClassModal = function() { openModal(`<div class="bg-white rounded-[2rem] w-full max-w-sm p-6 shadow-2xl relative animate-slide-up mx-auto my-auto"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold">Tambah Kelas</h3><button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div><input type="text" id="fc-name" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm mb-4 outline-none focus:border-emerald-500" placeholder="Nama Kelas"><button onclick="saveClass(this)" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg">Simpan</button></div>`); }
        window.saveClass = function(btn) { const name = document.getElementById('fc-name').value.trim(); if(!name) return; const data = { id: 'c'+Date.now(), name }; state.classes.push(data); setBtnLoading(btn, true, 'Simpan'); apiPost('addClass', data).then(() => { closeModal(); showToast('Tersimpan!', 'success'); loadMasterData('kelas'); }); }
        window.deleteClass = function(id) { if(!confirm("Hapus kelas?")) return; state.classes = state.classes.filter(x => x.id !== id); apiPost('deleteClass', {id}); showToast('Dihapus!', 'success'); loadMasterData('kelas'); }

        function renderMasterGuruHtml() {
            const list = state.teachers || [];
            return `
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div><h3 class="font-bold text-slate-800 text-lg">Akun Guru</h3></div>
                    <button onclick="openTeacherModal()" class="bg-emerald-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md"><i data-lucide="plus" class="w-4 h-4"></i> Tambah Guru</button>
                </div>
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-white text-slate-400 font-bold uppercase text-[10px] tracking-wider border-b border-slate-100"><tr><th class="px-6 py-4">Nama Lengkap</th><th class="px-6 py-4">Username & Akses</th><th class="px-6 py-4 text-right">Aksi</th></tr></thead>
                        <tbody class="divide-y divide-slate-50 text-slate-700">
                            ${list.length === 0 ? `<tr><td colspan="3" class="text-center py-8 text-slate-500 text-sm">Tidak ada guru.</td></tr>` : list.map(t => `
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="px-6 py-3 font-semibold text-slate-800">${t.name}</td>
                                    <td class="px-6 py-3"><p class="text-xs font-mono font-bold">@${t.username}</p><p class="text-[10px] text-emerald-600 font-bold max-w-[200px] truncate">${t.classes}</p></td>
                                    <td class="px-6 py-3 text-right"><div class="flex justify-end gap-1.5"><button onclick="openTeacherModal('${t.id}')" class="p-2 text-slate-400 hover:text-blue-600 rounded-xl"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button onclick="deleteTeacher('${t.id}')" class="p-2 text-slate-400 hover:text-rose-600 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }
        window.openTeacherModal = function(id = null) {
            let t = id ? state.teachers.find(x => x.id === id) : { name: '', username: '', password: '', classes: '' };
            const title = t.name.startsWith('Usth. ') ? 'Usth. ' : 'Ust. ';
            const plainName = t.name.replace(title, '');
            const cArr = t.classes.split(',');
            const cHtml = (state.classes||[]).map(c => `<label class="flex items-center gap-2 p-2 bg-slate-50 border border-slate-100 rounded cursor-pointer"><input type="checkbox" name="t_cls" value="${c.name}" ${cArr.includes(c.name)?'checked':''}> <span class="text-xs font-bold">${c.name}</span></label>`).join('');
            openModal(`
                <div class="bg-white rounded-[2rem] w-full max-w-md p-6 shadow-2xl relative animate-slide-up mx-auto my-auto max-h-[90vh] flex flex-col">
                    <div class="flex justify-between items-center mb-6 shrink-0"><h3 class="text-lg font-bold">${id?'Edit Guru':'Tambah Guru'}</h3><button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div>
                    <div class="overflow-y-auto hide-scroll space-y-3 pb-2">
                        <div class="grid grid-cols-[100px_1fr] gap-3">
                            <select id="t-title" class="px-3 py-3 border border-slate-200 rounded-xl text-sm outline-none"><option value="Ust. " ${title==='Ust. '?'selected':''}>Ust.</option><option value="Usth. " ${title==='Usth. '?'selected':''}>Usth.</option></select>
                            <input type="text" id="t-name" value="${plainName}" placeholder="Nama Lengkap" class="px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="t-user" value="${t.username}" placeholder="Username" class="px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500">
                            <input type="text" id="t-pass" value="${t.password}" placeholder="Password" class="px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500">
                        </div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-2 mt-2">Akses Kelas</label><div class="grid grid-cols-2 gap-2">${cHtml}</div></div>
                    </div>
                    <button onclick="saveTeacher('${id||''}', this)" class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-bold py-3.5 rounded-xl shadow-lg mt-6 text-sm shrink-0">Simpan Akun</button>
                </div>`);
        }
        window.saveTeacher = function(id, btn) {
            const title = document.getElementById('t-title').value;
            const name = document.getElementById('t-name').value.trim();
            const username = document.getElementById('t-user').value.trim().toLowerCase();
            const password = document.getElementById('t-pass').value.trim();
            const cls = Array.from(document.querySelectorAll('input[name="t_cls"]:checked')).map(cb=>cb.value).join(',');
            if(!name || !username || !password || !cls) return showToast('Lengkapi semua & pilih minimal 1 kelas!', 'error');
            
            const data = { id: id||'u'+Date.now(), name: title+name, username, password, classes: cls };
            if(id) { const idx = state.teachers.findIndex(x=>x.id===id); state.teachers[idx] = {...state.teachers[idx], ...data}; }
            else { state.teachers.push(data); }
            setBtnLoading(btn, true, 'Simpan');
            apiPost(id ? 'updateTeacher' : 'addTeacher', data).then(() => { closeModal(); showToast('Tersimpan!', 'success'); loadMasterData('akun'); });
        }
        window.deleteTeacher = function(id) { if(!confirm("Hapus guru?")) return; state.teachers = state.teachers.filter(x=>x.id!==id); apiPost('deleteTeacher', {id}); showToast('Dihapus!', 'success'); loadMasterData('akun'); }

        function renderMasterSettingHtml() {
            return `
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 animate-fade-in">
                <div class="mb-6 border-b border-slate-100 pb-4">
                    <h3 class="font-bold text-slate-800 text-lg">Pengaturan Sistem</h3>
                    <p class="text-xs text-slate-500 mt-1">Konfigurasi PDF, Tanda Tangan, dan Kategori.</p>
                </div>
                <div class="space-y-5">
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Global PDF URL (Materi Lengkap)</label><input type="text" id="set-pdf" value="${state.settings.GLOBAL_PDF_URL}" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm" placeholder="https://drive.google.com/..."></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">Nama Kepala Sekolah (Untuk TTD Print)</label><input type="text" id="set-kepsek" value="${state.settings.KEPALA_SEKOLAH}" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm"></div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">Lokasi Tanda Tangan (Cth: Cilegon)</label><input type="text" id="set-lokasi" value="${state.settings.LOKASI_TTD}" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm"></div>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Kategori Materi (Pisahkan dengan koma)</label><textarea id="set-kat" class="w-full h-24 px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm">${state.settings.KATEGORI_MATERI}</textarea></div>
                    <button onclick="saveAllSettings(this)" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-bold py-3.5 px-8 rounded-xl shadow-md">Simpan Pengaturan</button>
                </div>
            </div>`;
        }

        window.saveAllSettings = function(btn) {
            state.settings.GLOBAL_PDF_URL = document.getElementById('set-pdf').value.trim();
            state.settings.KEPALA_SEKOLAH = document.getElementById('set-kepsek').value.trim();
            state.settings.LOKASI_TTD = document.getElementById('set-lokasi').value.trim();
            state.settings.KATEGORI_MATERI = document.getElementById('set-kat').value.trim();
            setBtnLoading(btn, true, 'Simpan Pengaturan');
            apiPost('saveSettingsAll', state.settings).then(() => { setBtnLoading(btn, false); showToast('Pengaturan berhasil disimpan!', 'success'); });
        }

        function renderMasterMateriHtml() {
            const dynamicCats = state.settings.KATEGORI_MATERI.split(',').map(c => c.trim()).filter(c => c);
            const uniqueCats = ['SEMUA', ...dynamicCats];
            const list = state.materials.filter(m => state.activeCategoryTab === 'SEMUA' || m.category === state.activeCategoryTab);
            
            return `
            <div class="flex gap-2 mb-4 overflow-x-auto hide-scroll pb-1">
                ${uniqueCats.map(c => `<button onclick="filterMasterCategory('${c}')" class="mat-tab px-4 py-2 rounded-xl text-xs font-bold transition-all ${state.activeCategoryTab === c ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200'}">${c}</button>`).join('')}
            </div>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div><h3 class="font-bold text-slate-800 text-lg">Materi Hafalan</h3></div>
                    <div class="flex gap-2">
                        <button onclick="openImportModal()" class="bg-blue-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-blue-700 shadow-md"><i data-lucide="upload-cloud" class="w-4 h-4"></i> <span class="hidden sm:inline">Import CSV</span></button>
                    </div>
                </div>
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-white text-slate-400 font-bold uppercase text-[10px] tracking-wider border-b border-slate-100"><tr><th class="px-6 py-4">Kategori</th><th class="px-6 py-4">Nama Materi</th><th class="px-6 py-4 text-right">Aksi</th></tr></thead>
                        <tbody id="material-table-body" class="divide-y divide-slate-50 text-slate-700">
                            ${list.length === 0 ? `<tr><td colspan="3" class="text-center py-8 text-slate-500 text-sm">Tidak ada materi.</td></tr>` : list.map(m => `
                                <tr class="hover:bg-slate-50/80 transition-colors"><td class="px-6 py-3 text-xs font-bold text-emerald-600">${m.category}</td><td class="px-6 py-3 font-semibold text-slate-800">${m.name}</td>
                                <td class="px-6 py-3 text-right"><div class="flex justify-end gap-1.5"><button onclick="deleteMaterial('${m.id}')" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        window.filterMasterCategory = function(cat) {
            state.activeCategoryTab = cat;
            document.querySelectorAll('.mat-tab').forEach(btn => btn.className = `mat-tab px-4 py-2 rounded-xl text-xs font-bold transition-all ${btn.innerText === cat ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200'}`);
            loadMasterData('materi');
        }

        window.deleteMaterial = function(id) { if(!confirm("Hapus?"))return; state.materials = state.materials.filter(x=>x.id!==id); apiPost('deleteMaterial', {id}); showToast('Dihapus!', 'success'); loadMasterData('materi'); }
        
        window.openImportModal = function() { 
            const dynamicCats = state.settings.KATEGORI_MATERI.split(',').map(c => c.trim()).filter(c => c);
            const catOptions = dynamicCats.map(c => `<option value="${c}">${c}</option>`).join('');

            openModal(`
                <div class="bg-white rounded-[2rem] w-full max-w-lg p-6 shadow-2xl relative animate-slide-up mx-auto my-auto flex flex-col">
                    <div class="flex justify-between items-center mb-6 shrink-0"><h3 class="text-lg font-bold">Import Materi CSV</h3><button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button></div>
                    <div class="mb-3">
                        <label class="block text-xs font-bold mb-1">Pilih Kategori</label>
                        <select id="import-material-category" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-500">${catOptions}</select>
                    </div>
                    <textarea id="import-csv" class="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono resize-none mb-4 outline-none focus:border-emerald-500" placeholder='Nama Materi, "Arab", Latin, Arti, LinkImage'></textarea>
                    <button onclick="processImport(this)" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl shadow-md text-sm transition-colors shrink-0">Import Data</button>
                </div>`); 
        }
        window.processImport = function(btn) { 
            const txt = document.getElementById('import-csv').value.trim();
            const cat = document.getElementById('import-material-category').value;
            if(!txt) return showToast('Data CSV kosong', 'error');

            const lines = txt.split('\n');
            let newMats = [];
            lines.forEach((l, i) => {
                const p = l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.trim().replace(/^"|"$/g, ''));
                if(p.length >= 1 && p[0]) {
                    newMats.push({
                        id: 'm'+Date.now()+i, category: cat, name: p[0],
                        arabic: p[1] || '', latin: p[2] || '', arti: p[3] || '', image: p[4] || '', desc: ''
                    });
                }
            });

            if(newMats.length===0) return showToast('Format salah (Cek Panduan Placeholder)', 'error');
            
            setBtnLoading(btn, true, 'Import Data');
            apiPost('importMaterials', { materials: newMats }).then(() => {
                state.materials = [...state.materials, ...newMats];
                closeModal(); showToast(`Berhasil import ${newMats.length} data!`, 'success'); loadMasterData('materi');
            });
        }

        /* STREAMING_CHUNK: Setup & Init */
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('student')) renderStudentProgress(urlParams.get('student')); else renderLogin();
        });
    </script>
</body>
</html>
